name: Android and remote signing

on:
  push:
    branches: [master, feature/tailscale-gpg-agent]
  pull_request:
    branches: [master, feature/tailscale-gpg-agent]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The Android bridge compiles three ABIs; bound Go compiler memory on hosted runners.
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/tailscale/go.sum
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          # setup-android v3 also installs obsolete "tools" by default.
          packages: 'platform-tools'
      - name: Install Android components
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.2.13676358'
      - name: Test Tailscale bridge
        working-directory: native/tailscale
        run: go test -race ./...
      - name: Test GnuPG protocol and RSA interoperability
        run: |
          remote-agent-protocol/test.sh
          python3 tools/test-remote-rsa.py
      - name: Build embedded Tailscale
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" native/build-android.sh
      - name: Test cloud socket bridge
        run: |
          python3 -m unittest discover -s tools/remote-gpg-agent -p 'test_*.py'
          python3 tools/remote-gpg-agent/integration_test.py
      - name: Prepare stable APK signing keys
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set; the release APK will be unsigned"
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.p12"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; the debug APK uses a temporary key"
          fi
      - name: Build Android app and test signing
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs='-Xms128m -Xmx3072m'
          -Pkotlin.compiler.execution.strategy=in-process
          :OpenKeychain:assembleDebug :OpenKeychain:assembleRelease :OpenKeychain:testDebugUnitTest
          --tests 'org.sufficientlysecure.keychain.remoteagent.*'
      - name: Show APK signing certificates
        run: |
          for apk in OpenKeychain/build/outputs/apk/*/*.apk; do
            echo "== $apk"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | grep -E 'SHA-256|DN' || true
          done
          rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/debug.p12"
      - name: Test Ed25519 agent and gpg-bridge OpenPGP signatures
        run: |
          python3 tools/test-remote-ed25519.py
          python3 tools/test-gpg-bridge-pgp.py
      - name: Check out pinned upstream gpg-bridge client
        uses: actions/checkout@v4
        with:
          repository: iseki0/gpg-bridge
          ref: 60454d9354d02ae7f0288df110026d2aa1de8b59
          path: .interop/gpg-bridge
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build pinned upstream gpg-bridge client
        run: cargo build --release --locked --jobs 2 --manifest-path .interop/gpg-bridge/Cargo.toml
      - name: Test actual Rust gpg-bridge client interoperability
        run: >-
          python3 tools/gpg-bridge-integration/integration_test.py
          --binary "$GITHUB_WORKSPACE/.interop/gpg-bridge/target/release/gpg-bridge"
      - uses: actions/upload-artifact@v4
        with:
          name: openkeychain-remote-signing-debug
          path: |
            OpenKeychain/build/outputs/apk/debug/*.apk
            OpenKeychain/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish-preview:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/tailscale-gpg-agent'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openkeychain-remote-signing-debug
          path: preview
      - name: Publish downloadable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd preview
          find . -name '*.apk' -exec mv {} . \;
          mv OpenKeychain-debug.apk OpenKeychain-remote-signing-preview.apk
          assets=(OpenKeychain-remote-signing-preview.apk)
          if [ -f OpenKeychain-release.apk ]; then
            mv OpenKeychain-release.apk OpenKeychain-tailscale-release.apk
            assets+=(OpenKeychain-tailscale-release.apk)
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          tag="remote-signing-preview-${GITHUB_SHA:0:7}"
          cat > notes.md <<'NOTES'
          Android 7+ Debug preview of embedded Tailscale remote signing with GnuPG agent forwarding and the gpg-bridge HTTP/Noise protocol.

          Supports local software RSA, Ed25519, ECDSA, and DSA keys through gpg-bridge, plus RSA/Ed25519 through GnuPG agent forwarding. Each signature requires approval on the phone. Blank peer selection allows authenticated tailnet nodes permitted by your Tailscale ACLs.

          This APK is built and tested by this workflow; physical-device and live-tailnet validation remain outstanding.

          OpenKeychain-tailscale-release.apk (package org.sufficientlysecure.keychain.tailscale) is the non-debuggable build for daily use. OpenKeychain-remote-signing-preview.apk is the debuggable development build (package org.sufficientlysecure.keychain.debug). Both are signed with stable keys once the repository signing secrets are configured, and each installs alongside upstream OpenKeychain with separate private storage. Download the APKs and SHA256SUMS from Assets below.
          NOTES
          printf '\nSource: %s\n\nSetup: https://github.com/%s/blob/%s/docs/remote-agent.md\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> notes.md
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --prerelease --latest=false \
              --title "Tailscale remote signing preview (${GITHUB_SHA:0:7})" --notes-file notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "${assets[@]}" SHA256SUMS
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false \
            --title "Tailscale remote signing preview (${GITHUB_SHA:0:7})" --notes-file notes.md
          {
            printf '### Download APK\n\n'
            printf '[APK](https://github.com/%s/releases/download/%s/OpenKeychain-remote-signing-preview.apk)\n\n' "$GITHUB_REPOSITORY" "$tag"
            printf '[Checksums](https://github.com/%s/releases/download/%s/SHA256SUMS)\n' "$GITHUB_REPOSITORY" "$tag"
          } >> "$GITHUB_STEP_SUMMARY"
