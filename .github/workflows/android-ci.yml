name: Android and remote signing

on:
  push:
    branches: [master, feature/tailscale-gpg-agent]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The Android bridge compiles three ABIs; bound Go compiler memory on hosted runners.
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/tailscale/go.sum
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          # setup-android v3 also installs obsolete "tools" by default.
          packages: 'platform-tools'
      - name: Install Android components
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.2.13676358'
      - name: Test Tailscale bridge
        working-directory: native/tailscale
        run: go test -race ./...
      - name: Test GnuPG protocol and RSA interoperability
        run: |
          remote-agent-protocol/test.sh
          python3 tools/test-remote-rsa.py
      - name: Build embedded Tailscale
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" native/build-android.sh
      - name: Test cloud socket bridge
        run: |
          python3 -m unittest discover -s tools/remote-gpg-agent -p 'test_*.py'
          python3 tools/remote-gpg-agent/integration_test.py
      - name: Build Android app and test signing
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs='-Xms128m -Xmx3072m'
          -Pkotlin.compiler.execution.strategy=in-process
          :OpenKeychain:assembleDebug :OpenKeychain:testDebugUnitTest
          --tests 'org.sufficientlysecure.keychain.remoteagent.*'
      - name: Test Ed25519 agent and gpg-bridge OpenPGP signatures
        run: |
          python3 tools/test-remote-ed25519.py
          python3 tools/test-gpg-bridge-pgp.py
      - name: Check out pinned upstream gpg-bridge client
        uses: actions/checkout@v4
        with:
          repository: iseki0/gpg-bridge
          ref: 60454d9354d02ae7f0288df110026d2aa1de8b59
          path: .interop/gpg-bridge
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Build pinned upstream gpg-bridge client
        run: cargo build --release --locked --jobs 2 --manifest-path .interop/gpg-bridge/Cargo.toml
      - name: Test actual Rust gpg-bridge client interoperability
        run: >-
          python3 tools/gpg-bridge-integration/integration_test.py
          --binary "$GITHUB_WORKSPACE/.interop/gpg-bridge/target/release/gpg-bridge"
      - uses: actions/upload-artifact@v4
        with:
          name: openkeychain-remote-signing-debug
          path: OpenKeychain/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish-preview:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/tailscale-gpg-agent'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openkeychain-remote-signing-debug
          path: preview
      - name: Publish downloadable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd preview
          mv OpenKeychain-debug.apk OpenKeychain-remote-signing-preview.apk
          sha256sum OpenKeychain-remote-signing-preview.apk > SHA256SUMS
          tag="remote-signing-preview-${GITHUB_SHA:0:7}"
          cat > notes.md <<'NOTES'
          Android 7+ Debug preview of embedded Tailscale remote signing with GnuPG agent forwarding and the gpg-bridge HTTP/Noise protocol.

          Supports local software RSA, Ed25519, ECDSA, and DSA keys through gpg-bridge, plus RSA/Ed25519 through GnuPG agent forwarding. Each signature requires approval on the phone. Blank peer selection allows authenticated tailnet nodes permitted by your Tailscale ACLs.

          This APK is built and tested by this workflow; physical-device and live-tailnet validation remain outstanding. Preview signing certificates can differ between builds: keep the existing app and export a verified, protected key backup before migrating to a replacement preview.

          This debug app installs alongside upstream OpenKeychain with separate private storage. Download the APK and SHA256SUMS from Assets below.
          NOTES
          printf '\nSource: %s\n\nSetup: https://github.com/%s/blob/%s/docs/remote-agent.md\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> notes.md
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --prerelease --latest=false \
              --title "Tailscale remote signing preview (${GITHUB_SHA:0:7})" --notes-file notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            OpenKeychain-remote-signing-preview.apk SHA256SUMS
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false \
            --title "Tailscale remote signing preview (${GITHUB_SHA:0:7})" --notes-file notes.md
          {
            printf '### Download APK\n\n'
            printf '[APK](https://github.com/%s/releases/download/%s/OpenKeychain-remote-signing-preview.apk)\n\n' "$GITHUB_REPOSITORY" "$tag"
            printf '[Checksums](https://github.com/%s/releases/download/%s/SHA256SUMS)\n' "$GITHUB_REPOSITORY" "$tag"
          } >> "$GITHUB_STEP_SUMMARY"
